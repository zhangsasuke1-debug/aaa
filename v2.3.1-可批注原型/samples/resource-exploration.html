<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科学探究活动设计</title>
<style>*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f3f5f7;color:#293239;font:16px/1.9 "Microsoft YaHei",sans-serif}main{max-width:850px;margin:28px auto;padding:36px;background:#fff;border:1px solid #dce3e8}header{border-bottom:2px solid #326c5b;padding-bottom:22px;margin-bottom:25px}h1{font-size:27px;line-height:1.5;margin:10px 0;overflow-wrap:anywhere}h2{font-size:19px;margin:25px 0 10px}p{white-space:pre-wrap;margin:0}small{color:#66747e}section{margin-bottom:22px}.sample{font-size:12px;color:#397564}@media(max-width:600px){main{margin:0;padding:24px 18px;border:0}h1{font-size:24px}}@media print{body{background:white}main{border:0;margin:0;padding:0}}</style></head>
<body><main><header><span class="sample">本地内容样例</span><h1>科学探究活动设计</h1><small>高中 · 教学设计 · HTML</small></header><section><h2>探究问题</h2><p>明确要观察的现象，写出一个可以通过记录和比较讨论的问题。</p></section>
<section><h2>活动过程</h2><p>1. 提出假设。
2. 商定观察方法。
3. 记录过程与现象。
4. 比较各组结果。
5. 解释差异并提出后续问题。</p></section>
<section><h2>评价与反思</h2><p>评价记录是否完整、证据是否支持结论，并列出需要再次观察的内容。</p></section></main></body></html>
